# LNAXY REALISM — Iris / OptiFine shader settings.
# Quality presets set a practical selection of the available controls.

oldLighting=false

# Main settings screen, exposed in Shader Pack Settings.
screen=profile.LOW profile.MEDIUM profile.HIGH profile.ULTRA screen.LNAXY_COLOR screen.LNAXY_WATER
screen.columns=2
screen.LNAXY_COLOR=LNAXY_EXPOSURE LNAXY_CONTRAST LNAXY_SATURATION LNAXY_VIGNETTE LNAXY_BLOOM
screen.LNAXY_WATER=LNAXY_WATER_TINT LNAXY_WATER_OPACITY
sliders=LNAXY_EXPOSURE LNAXY_CONTRAST LNAXY_SATURATION LNAXY_VIGNETTE LNAXY_BLOOM LNAXY_WATER_TINT LNAXY_WATER_OPACITY

# Presets: tune visible post-processing and water controls.
profile.LOW=LNAXY_EXPOSURE:1.00 LNAXY_CONTRAST:1.00 LNAXY_SATURATION:1.00 LNAXY_VIGNETTE:0.00 LNAXY_BLOOM:0.00 LNAXY_WATER_TINT:0.20 LNAXY_WATER_OPACITY:0.80
profile.MEDIUM=LNAXY_EXPOSURE:1.00 LNAXY_CONTRAST:1.05 LNAXY_SATURATION:1.05 LNAXY_VIGNETTE:0.05 LNAXY_BLOOM:0.05 LNAXY_WATER_TINT:0.30 LNAXY_WATER_OPACITY:0.85
profile.HIGH=LNAXY_EXPOSURE:1.00 LNAXY_CONTRAST:1.10 LNAXY_SATURATION:1.10 LNAXY_VIGNETTE:0.10 LNAXY_BLOOM:0.15 LNAXY_WATER_TINT:0.40 LNAXY_WATER_OPACITY:0.90
profile.ULTRA=LNAXY_EXPOSURE:1.05 LNAXY_CONTRAST:1.15 LNAXY_SATURATION:1.15 LNAXY_VIGNETTE:0.15 LNAXY_BLOOM:0.30 LNAXY_WATER_TINT:0.50 LNAXY_WATER_OPACITY:0.95
